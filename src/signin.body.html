<section class="auth">
  <div class="acard">
    <h1>Welcome back</h1>
    <p class="sub">Sign in to see your checklists and your path.</p>
    <form class="pv" novalidate>
      <div class="fld"><label for="si-email">Email</label><input id="si-email" type="email" autocomplete="email" placeholder="you@email.com" required></div>
      <div class="fld"><label for="si-pass">Password</label><input id="si-pass" type="password" autocomplete="current-password" required></div>
      <button class="btn btn-p btn-lg" type="submit">Sign in</button>
    </form>
    <p class="alt">New here? <a href="/signup/">Make a free account</a></p>
  </div>
</section>
