# Daily publisher: stories in data/stories/ whose "published" date has arrived (Toronto time) go live.
# The weekly research routine adds story files with a future date; this build makes them appear on the day.
name: Publish due stories
on:
  schedule:
    - cron: "15 11 * * *"   # 06:15 Toronto (EST), 07:15 in EDT
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["data/stories/**"]
permissions:
  contents: write
concurrency: { group: publish, cancel-in-progress: false }
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - name: Tools
        run: |
          pip install pillow
          npm i --no-save --prefix /tmp/pw playwright@1.56.1
          npx --prefix /tmp/pw playwright install --with-deps chromium-headless-shell
          echo "LV_PLAYWRIGHT=/tmp/pw/node_modules/playwright-core" >> $GITHUB_ENV
          ls -d ~/.cache/ms-playwright/*
      - name: Build
        env: { TZ: America/Toronto }
        run: |
          export LV_CHROME=$(ls ~/.cache/ms-playwright/chromium_headless_shell-*/chrome-headless-shell-linux*/chrome-headless-shell | head -1)
          echo "LV_CHROME=$LV_CHROME"
          python build_app.py
      - name: Commit if anything changed
        run: |
          rm -rf _covers_tmp __pycache__
          git add -A
          git diff --cached --quiet && { echo "Nothing due today."; exit 0; }
          git -c user.name="LaunchVault publisher" -c user.email="actions@users.noreply.github.com" commit -m "Publish due stories ($(TZ=America/Toronto date +%F))"
          git push
