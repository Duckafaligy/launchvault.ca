nswers a question your customers type into Google.","from":"Stencil AI breakdown","n":5,"task":""}],"lead":{"id":"x1","text":"Ask three people you know what boring task they repeat every week at work. Write the answers down.","from":"Pattern from Stencil AI","href":"/app/story/stencil-ai/"}},"boothie":{"title":"Ride a wave","source":"boothie","name":"Boothie","steps":[{"id":"s1","text":"Scroll TikTok or Instagram for 20 minutes and write down three looks or formats you keep seeing.","from":"Boothie breakdown","n":1,"task":""},{"id":"s2","text":"Pick one and ask: could a tool make this in one tap? Sketch the before and after.","from":"Boothie breakdown","n":2,"task":""},{"id":"s3","text":"Make one free thing people can use, and one paid thing that is clearly better.","from":"Boothie breakdown","n":3,"task":""},{"id":"s4","text":"Post three before-and-after carousels from your own account and track which one gets saved most.","from":"Boothie breakdown","n":4,"task":""},{"id":"s5","text":"If people find you through TikTok, test that your link actually opens from inside the TikTok app.","from":"Boothie breakdown","n":5,"task":""}],"lead":{"id":"x1","text":"Scroll TikTok or Instagram for 20 minutes and write down three looks or formats you keep seeing.","from":"Pattern from Boothie","href":"/app/story/boothie/"}},"mindset":{"title":"Build the audience first, then the app","source":"mindset","name":"Mindset","steps":[{"id":"s1","text":"Pick one topic you could post about every week for a year, and post the first one this week.","from":"Mindset breakdown","n":1,"task":""},{"id":"s2","text":"Look at which of your posts or videos people save or share the most. That's the thing they'd pay for.","from":"Mindset breakdown","n":2,"task":""},{"id":"s3","text":"Ask five people who follow you what they'd want in an app or tool about that topic.","from":"Mindset breakdown","n":3,"task":""},{"id":"s4","text":"Give early testers free access and ask them one question: what almost made you stop using it?","from":"Mindset breakdown","n":4,"task":""},{"id":"s5","text":"If you use other people's content, get permission and agree how they get paid before you launch.","from":"Mindset breakdown","n":5,"task":""}],"lead":{"id":"x1","text":"Pick one topic you could post about every week for a year, and post the first one this week.","from":"Pattern from Mindset","href":"/app/story/mindset/"}},"gojiberry":{"title":"Throw away the first version when nobody pays","source":"gojiberry","name":"Gojiberry","steps":[{"id":"s1","text":"Put up a one-page site for your idea with a price on it, not just a waitlist, and see if anyone clicks Buy.","from":"Gojiberry breakdown","n":1,"task":""},{"id":"s2","text":"If your waitlist doesn't pay, call five people on it and ask what they would pay for instead.","from":"Gojiberry breakdown","n":2,"task":""},{"id":"s3","text":"Write one honest Reddit post about something that went wrong for you, in a subreddit that allows it, and reply to every comment.","from":"Gojiberry breakdown","n":3,"task":""},{"id":"s4","text":"Spend a week commenting helpfully in that community before you post about your own project.","from":"Gojiberry breakdown","n":4,"task":""},{"id":"s5","text":"Use your own product to find your first customers, so the way you sell is also your demo.","from":"Gojiberry breakdown","n":5,"task":""}],"lead":{"id":"x1","text":"Put up a one-page site for your idea with a price on it, not just a waitlist, and see if anyone clicks Buy.","from":"Pattern from Gojiberry","href":"/app/story/gojiberry/"}},"postiz":{"title":"Ship something small first","source":"postiz","name":"Postiz","steps":[{"id":"c1","text":"Pick one place your users already hang out and post there every time you ship something, even small updates.","from":"Open source","n":1,"task":"Pick the one place and post your next small update there today."},{"id":"c2","text":"Give something away free and charge for the convenient version, the way Postiz is free to self-host and paid to use hosted.","from":"Move 1","n":2,"task":"Write down the one thing you could give away free, and the easy paid version."},{"id":"c6","text":"Plan for a long flat stretch. Postiz stayed under $15K a month for about 14 months after going open source. Pace yourself around school.","from":"Open source","n":6,"task":"Pick one hour a week you can keep through exams and put it in your calendar."},{"id":"c4","text":"Find your most active users and build for them. Postiz followed the automation crowd instead of competing with Buffer.","from":"Finding the users who stay","n":4,"task":"Find the five people who use your thing most and ask them one question each."},{"id":"c3","text":"Build a plug-in for a tool that's growing fast right now, like AI agents or n8n. It's cheap for one person and puts you where new users are looking.","from":"The turning point","n":3,"task":"List three tools growing fast right now that your idea could plug into."}],"lead":{"id":"x1","text":"Pick one place your users already hang out and post there every time you ship something, even small updates.","from":"Pattern from Postiz","href":"/app/story/postiz/"}}},"path":{"title":"Ship something small first","source":"postiz","steps":[{"id":"c1","text":"Pick one place your users already hang out and post there every time you ship something, even small updates.","from":"Open source","n":1,"task":"Pick the one place and post your next small update there today."},{"id":"c2","text":"Give something away free and charge for the convenient version, the way Postiz is free to self-host and paid to use hosted.","from":"Move 1","n":2,"task":"Write down the one thing you could give away free, and the easy paid version."},{"id":"c6","text":"Plan for a long flat stretch. Postiz stayed under $15K a month for about 14 months after going open source. Pace yourself around school.","from":"Open source","n":6,"task":"Pick one hour a week you can keep through exams and put it in your calendar."},{"id":"c4","text":"Find your most active users and build for them. Postiz followed the automation crowd instead of competing with Buffer.","from":"Finding the users who stay","n":4,"task":"Find the five people who use your thing most and ask them one question each."},{"id":"c3","text":"Build a plug-in for a tool that's growing fast right now, like AI agents or n8n. It's cheap for one person and puts you where new users are looking.","from":"The turning point","n":3,"task":"List three tools growing fast right now that your idea could plug into."}],"extra":{"id":"x1","text":"Ask for money early: offer the easy paid version to your 5 most active users.","from":"Pattern from Gojiberry","href":"/app/story/gojiberry/"}},"quiz":[{"q":"How much time could you give this most weeks?","o":["Under 5 h a week","About 10 h a week","15 h or more"],"w":[{"stencil-ai":2},{"windmill-growth":1,"postiz":1},{"postiz":2,"dm-champ":1}]},{"q":"How much money could you put in?","o":["$0","Under $100","Under $1,000"],"w":[{"postiz":2,"stencil-ai":2},{"stencil-ai":2,"windmill-growth":1,"gojiberry":1},{"windmill-growth":2,"dm-champ":2}]},{"q":"Can you code, even a little?","o":["Yes, I can code","A little","Not yet"],"w":[{"postiz":2,"stencil-ai":1},{"stencil-ai":1,"gojiberry":1},{"windmill-growth":2}]},{"q":"What are you already good at, even a little?","o":["Design, video or writing","Talking to people","Not sure yet, and that's fine"],"w":[{"windmill-growth":2,"postiz":1},{"windmill-growth":2,"gojiberry":2},{"stencil-ai":1,"gojiberry":1}]},{"q":"Who around you has a problem worth fixing?","o":["Someone in my family","A local shop or business","People in an online group I'm in","No one comes to mind yet"],"w":[{"stencil-ai":3},{"windmill-growth":3},{"postiz":2,"dm-champ":1},{"gojiberry":2,"postiz":1}]},{"q":"Which sounds most like fun?","o":["Building an app people use","Doing a job for real clients","Testing an idea fast and changing it"],"w":[{"postiz":2,"stencil-ai":2},{"windmill-growth":3},{"gojiberry":2,"dm-champ":2}]},{"q":"Where do people your age hang out online?","o":["Reddit or Discord","TikTok or Instagram","Not sure"],"w":[{"postiz":2},{"stencil-ai":1,"windmill-growth":1},{}]},{"q":"How soon would you like a first sale?","o":["This month","This school term","No rush"],"w":[{"gojiberry":2,"windmill-growth":1},{"dm-champ":1,"stencil-ai":1},{"postiz":2}]}],"search_extra":[{"t":"Rezi \u00b7 phase 1: A template on Reddit","k":"A template on Reddit The founder graduated with low grades but still got interviews at big companies, and put that down to his resume. In May 2015 he posted a resume template built to pass hiring software (called ATS) on Reddit so others could use it. The first thing he sold was that template as a Word file with a short guide. Share something genuinely useful for free first; the people who use it tell you what to build.","h":"/app/story/rezi/#ph1","g":"Phases"},{"t":"Rezi \u00b7 phase 2: Four slow years","k":"Four slow years The founder moved to South Korea and taught English to pay the bills. A bare-bones tool called Rezi Instant reformatted people's text into the template, with no logins and no database. He spent 2015 to 2018 looking for money and paid an agency to build the real software, which he later called a mistake. A tiny version that works today beats a big version you are waiting for someone else to build.","h":"/app/story/rezi/#ph2","g":"Phases"},{"t":"Rezi \u00b7 phase 3: Launch as a paid app","k":"Launch as a paid app Rezi launched as a web app with accounts and a paid upgrade in September 2019. Two months later the founder did an AMA (ask me anything) on Reddit, which he calls 'the most authentic channel'. A deal on AppSumo, a site that sells cheap lifetime deals on software, brought in users during the pandemic. StackCommerce, another deals site, brought in revenue. Go back to the place your first users came from and talk to them in public.","h":"/app/story/rezi/#ph3","g":"Phases"},{"t":"Rezi \u00b7 phase 4: First in line for AI writing","k":"First in line for AI writing When OpenAI released GPT-3, Rezi used it to write resume lines for users, while the team was just two people. By March 2021 the homepage said 'POWERED BY GPT-3' and 'THE FIRST GTP-3 POWERED RESUME BUILDER', typo included. When a new tool appears, ask what boring part of your product it could do for the user.","h":"/app/story/rezi/#ph4","g":"Phases"},{"t":"Rezi \u00b7 phase 5: The ChatGPT wave","k":"The ChatGPT wave When ChatGPT made everyone curious about AI, Rezi was already an AI resume builder. The company says it hit $1M a year in recurring revenue in March 2023 and 1 million users in July 2023. In January 2023 the plans were Free, $3 a month and $29 a month. Be ready before the wave arrives; you can't build fast enough once it does.","h":"/app/story/rezi/#ph5","g":"Phases"},{"t":"Rezi \u00b7 phase 6: Search, not ads","k":"Search, not ads The founder says Rezi spent about $15K a month on paid ads for a year without making the money back, then stopped. Growth came from search results instead: Rezi ranks for 'AI Resume Builder'. He also removed the $3 plan, which he says made each customer worth more. But since April 2026 revenue has fallen every month, from $275,551 to $216,471 in October, about 21% less. We couldn't find a public reason. If ads don't pay for themselves after a fair test, stop and put that money into something that keeps paying off over time, like search. Then keep checking your numbers, because growth can stall.","h":"/app/story/rezi/#ph6","g":"Phases"},{"t":"Rezi move 1: Posted an ATS-friendly resume template on Reddit for anyone to use \u00b7 May 2015","h":"/app/story/rezi/#chart","g":"Moves"},{"t":"Rezi move 2: Sold the template as a Word file with a guide for about $9.69 \u00b7 Before 2019","h":"/app/story/rezi/#chart","g":"Moves"},{"t":"Rezi move 3: Launched as a web app with a paid Pro upgrade \u00b7 Sep 2019","h":"/app/story/rezi/#chart","g":"Moves"},{"t":"Rezi move 4: Did an AMA on Reddit's r/IAmA \u00b7 Nov 2019","h":"/app/story/rezi/#chart","g":"Moves"},{"t":"Rezi move 5: Ran a deal on AppSumo during the pandemic \u00b7 2020","h":"/app/story/rezi/#chart","g":"Moves"},{"t":"Rezi move 6: Added GPT-3 to write resume content \u00b7 Dec 2020","h":"/app/story/rezi/#chart","g":"Moves"},{"t":"Rezi move 7: Gave away its most expensive plan for free; the founder says it brought just under 70,000 signups in one day \u00b7 Oct or Nov 2023","h":"/app/story/rezi/#chart","g":"Moves"},{"t":"Rezi move 8: Stopped paid ads after a year and leaned on search traffic \u00b7 2024","h":"/app/story/rezi/#chart","g":"Moves"},{"t":"Rezi \u00b7 TrustMRR: Rezi","k":"TrustMRR: Rezi MRR, all-time revenue, monthly series, founder count","h":"/app/story/rezi/#sources","g":"Sources"},{"t":"Rezi \u00b7 Rezi blog: 0 to 1 million users","k":"Rezi blog: 0 to 1 million users Reddit origin, Rezi Instant, 2019 launch, GPT-3, team of two","h":"/app/story/rezi/#sources","g":"Sources"},{"t":"Rezi \u00b7 Rezi blog: 2023 year in review","k":"Rezi blog: 2023 year in review $1M ARR in March 2023, 1M users, 55,376 signups in a day, 12 team members","h":"/app/story/rezi/#sources","g":"Sources"},{"t":"Rezi \u00b7 Starter Story interview","k":"Starter Story interview $9.69 template, agency mistake, Reddit AMA, AppSumo, paid ads, search traffic (SEO), giveaway, team size","h":"/app/story/rezi/#sources","g":"Sources"},{"t":"Rezi \u00b7 Reddit r/IAmA thread","k":"Reddit r/IAmA thread The founder's 2019 AMA","h":"/app/story/rezi/#sources","g":"Sources"},{"t":"Rezi \u00b7 We Are Founders article","k":"We Are Founders article 3M+ users and $5M+ lifetime revenue","h":"/app/story/rezi/#sources","g":"Sources"},{"t":"Rezi \u00b7 Wayback Machine: rezi.ai","k":"Wayback Machine: rezi.ai Homepage headlines and prices in 2021, 2023 and 2026","h":"/app/story/rezi/#sources","g":"Sources"},{"t":"AEO Engine \u00b7 phase 1: An Amazon agency","k":"An Amazon agency The business began as FosterFBA, which helped people sell on Amazon. FBA means Fulfilled by Amazon: Amazon stores and ships the seller's products. In January 2019 its homepage offered product research, listing optimization and free tools. By 2023 it called itself a 'Data Driven Amazon Advertising Agency' and offered a free audit to get calls booked. A small service business can run for years and build skills you can carry into the next thing.","h":"/app/story/aeo-engine/#ph1","g":"Phases"},{"t":"AEO Engine \u00b7 phase 2: Spotting the new search","k":"Spotting the new search People started asking ChatGPT and Google's AI answers instead of clicking search results. The company says it was already doing AI search work through 2025. By October 2025 aeoengine.ai was live, promising to get brands 'featured in ChatGPT, Google AI & Perplexity answers' and offering a free audit. When the way people search changes, the people who already know the old way have a head start on the new one.","h":"/app/story/aeo-engine/#ph2","g":"Phases"},{"t":"AEO Engine \u00b7 phase 3: A new name","k":"A new name The company says it 'formalized' the AEO Engine brand around January 2026. AEO means answer engine optimization: making sure an AI recommends you when someone asks a question. It is like SEO (getting found on Google), but for AI answers. That month a founder-story site listed it at $65,000 a month, which matches the Stripe numbers. A clear name for what you do can matter as much as the work itself.","h":"/app/story/aeo-engine/#ph3","g":"Phases"},{"t":"AEO Engine \u00b7 phase 4: Showing up everywhere","k":"Showing up everywhere In March 2026 it started a podcast about AI search, now billed as a daily show. In April the founder gave the AEO talk at a big Amazon seller conference in Nashville, where the agency's old clients gather. Revenue jumped to $98K in March, then settled around $75K to $77K a month. Go where your existing customers already are and teach them something new.","h":"/app/story/aeo-engine/#ph4","g":"Phases"},{"t":"AEO Engine \u00b7 phase 5: The jump","k":"The jump Revenue went from about $80K in August to $164K in September and $204K in October. Plans are public: $1,597 or $2,997 a month, or custom from $10,000. In November it published an 'Answer Index' ranking how visible 100 law firms are in AI answers. We couldn't find a public reason for the September jump. Public prices and free reports let buyers say yes faster.","h":"/app/story/aeo-engine/#ph5","g":"Phases"},{"t":"AEO Engine move 1: Started an Amazon seller marketing agency (FosterFBA) \u00b7 2018","h":"/app/story/aeo-engine/#chart","g":"Moves"},{"t":"AEO Engine move 2: Gave away free tools and a free product audit to bring in Amazon sellers \u00b7 2019","h":"/app/story/aeo-engine/#chart","g":"Moves"},{"t":"AEO Engine move 3: Launched aeoengine.ai with a free AI-visibility audit \u00b7 Oct 2025","h":"/app/story/aeo-engine/#chart","g":"Moves"},{"t":"AEO Engine move 4: Re-launched the business under the AEO Engine name \u00b7 Jan 2026","h":"/app/story/aeo-engine/#chart","g":"Moves"},{"t":"AEO Engine move 5: Started a podcast about AI search (episode 3 is dated Mar 12 2026), now daily \u00b7 Mar 2026","h":"/app/story/aeo-engine/#chart","g":"Moves"},{"t":"AEO Engine move 6: Gave the main AEO talk at an Amazon seller conference in Nashville \u00b7 Apr 2026","h":"/app/story/aeo-engine/#chart","g":"Moves"},{"t":"AEO Engine move 7: Published a free 'Answer Index' ranking 100 law firms' AI visibility \u00b7 Nov 2026","h":"/app/story/aeo-engine/#chart","g":"Moves"},{"t":"AEO Engine \u00b7 TrustMRR: AEO Engine","k":"TrustMRR: AEO Engine MRR, revenue, monthly series, founder count","h":"/app/story/aeo-engine/#sources","g":"Sources"},{"t":"AEO Engine \u00b7 TrustMRR: AEO Engine (markdown profile)","k":"TrustMRR: AEO Engine (markdown profile) Active subscriptions, founded date, daily revenue","h":"/app/story/aeo-engine/#sources","g":"Sources"},{"t":"AEO Engine \u00b7 AEO Engine: About","k":"AEO Engine: About Team, founding history, brands served, Nashville keynote","h":"/app/story/aeo-engine/#sources","g":"Sources"},{"t":"AEO Engine \u00b7 AEO Engine: PR and newsroom","k":"AEO Engine: PR and newsroom FosterFBA roots, 2026 re-brand, FounderBase link","h":"/app/story/aeo-engine/#sources","g":"Sources"},{"t":"AEO Engine \u00b7 AEO Engine: company facts page","k":"AEO Engine: company facts page Founding timeline, 100+ Amazon and Shopify brands","h":"/app/story/aeo-engine/#sources","g":"Sources"},{"t":"AEO Engine \u00b7 AEO Engine: Pricing","k":"AEO Engine: Pricing Plan prices","h":"/app/story/aeo-engine/#sources","g":"Sources"},{"t":"AEO Engine \u00b7 AEO Engine: Podcast","k":"AEO Engine: Podcast Daily podcast","h":"/app/story/aeo-engine/#sources","g":"Sources"},{"t":"AEO Engine \u00b7 FounderBase: AEO Engine","k":"FounderBase: AEO Engine $65,000/mo, 70% margin, $1,000 startup cost","h":"/app/story/aeo-engine/#sources","g":"Sources"},{"t":"AEO Engine \u00b7 Wayback: fosterfba.com","k":"Wayback: fosterfba.com 2019, 2023 and 2025 homepages of the older agency","h":"/app/story/aeo-engine/#sources","g":"Sources"},{"t":"AEO Engine \u00b7 Wayback: aeoengine.ai","k":"Wayback: aeoengine.ai First archived AEO Engine homepage","h":"/app/story/aeo-engine/#sources","g":"Sources"},{"t":"Upscale B2B \u00b7 phase 1: Fixing their own problem","k":"Fixing their own problem Cold email means emailing businesses that don't know you yet. To send a lot without landing in spam, agencies (companies that do this work for clients) need many 'warmed up' inboxes: new inboxes used gently at first so email providers trust them. The company's site says it had been burned by bad inbox providers, 'That's why we started Upscale B2B'. TrustMRR lists March 2023 as the founding date. A problem that annoys you at work is often a problem other people will pay to make go away.","h":"/app/story/upscale-b2b/#ph1","g":"Phases"},{"t":"Upscale B2B \u00b7 phase 2: Selling inboxes to agencies","k":"Selling inboxes to agencies The site sold Google Workspace and Microsoft inboxes, set up and warmed, for $2 to $7 a month each, with a free domain (a web address). Bigger buyers got lower prices: $2.50 each at 100 inboxes, $2 at 1,000. A sales calculator showed how many deals more inboxes could bring. Selling to businesses that already spend money on a problem is easier than convincing someone they have one.","h":"/app/story/upscale-b2b/#ph2","g":"Phases"},{"t":"Upscale B2B \u00b7 phase 3: A separate brand for inboxes","k":"A separate brand for inboxes The inbox business got its own site, warminboxes.com, first archived in April 2025 with 'Get FREE Warmed-Up Domains'. By November 2025 its headline promised '90%+ Deliverability' (the share of emails that land in the inbox, not spam). The founder's TrustMRR account is named after it. If one product sells itself, give it its own name and page so people can find it.","h":"/app/story/upscale-b2b/#ph3","g":"Phases"},{"t":"Upscale B2B \u00b7 phase 4: Running campaigns, try first","k":"Running campaigns, try first By January 2026 upscaleb2b.com led with done-for-you lead generation (finding possible customers for a business) and a trial: 'the only provider offering a trial for fully managed lead generation'. It runs a small pilot campaign first, then grows it if it works. Revenue went from about $34K in December 2025 to $99K in October 2026. Letting customers try before they commit can win clients who would never sign a big contract cold.","h":"/app/story/upscale-b2b/#ph4","g":"Phases"},{"t":"Upscale B2B move 1: Started after bad experiences with other inbox providers \u00b7 2023","h":"/app/story/upscale-b2b/#chart","g":"Moves"},{"t":"Upscale B2B move 2: Spun the inbox product into its own brand, WarmInboxes \u00b7 Apr 2025","h":"/app/story/upscale-b2b/#chart","g":"Moves"},{"t":"Upscale B2B move 3: Sold warmed Google and Microsoft inboxes from $2 to $7 a month, with bulk discounts \u00b7 May 2025","h":"/app/story/upscale-b2b/#chart","g":"Moves"},{"t":"Upscale B2B move 4: Gave away a free .com domain with every inbox purchase \u00b7 May 2025","h":"/app/story/upscale-b2b/#chart","g":"Moves"},{"t":"Upscale B2B move 5: Switched the main site to done-for-you lead generation with a trial \u00b7 Jan 2026","h":"/app/story/upscale-b2b/#chart","g":"Moves"},{"t":"Upscale B2B move 6: Listed in Instantly's (a cold-email software company) expert directory \u00b7 2026","h":"/app/story/upscale-b2b/#chart","g":"Moves"},{"t":"Upscale B2B \u00b7 TrustMRR: Upscale System LLC","k":"TrustMRR: Upscale System LLC MRR, revenue, monthly series, founder count","h":"/app/story/upscale-b2b/#sources","g":"Sources"},{"t":"Upscale B2B \u00b7 TrustMRR: Upscale System LLC (markdown profile)","k":"TrustMRR: Upscale System LLC (markdown profile) Active subscriptions, founded date, description","h":"/app/story/upscale-b2b/#sources","g":"Sources"},{"t":"Upscale B2B \u00b7 Wayback: upscaleb2b.com","k":"Wayback: upscaleb2b.com Inbox prices and origin story, May 2025","h":"/app/story/upscale-b2b/#sources","g":"Sources"},{"t":"Upscale B2B \u00b7 Wayback: upscaleb2b.com","k":"Wayback: upscaleb2b.com Switch to managed lead gen with a trial","h":"/app/story/upscale-b2b/#sources","g":"Sources"},{"t":"Upscale B2B \u00b7 Wayback: warminboxes.com","k":"Wayback: warminboxes.com Separate inbox brand","h":"/app/story/upscale-b2b/#sources","g":"Sources"},{"t":"Upscale B2B \u00b7 Instantly expert directory: Upscale B2B","k":"Instantly expert directory: Upscale B2B Services, $2K to $5K pricing, claimed email volume","h":"/app/story/upscale-b2b/#sources","g":"Sources"},{"t":"Upscale B2B \u00b7 Upscale B2B homepage","k":"Upscale B2B homepage Pilot-first model, '1 million emails sent per month'","h":"/app/story/upscale-b2b/#sources","g":"Sources"},{"t":"DM Champ \u00b7 phase 1: The problem at work","k":"The problem at work The founder ran a marketing agency and did the marketing for a hair transplant clinic. He saw clinics losing leads because nobody answered WhatsApp, Instagram and website chats fast enough. That became the idea. The best ideas often come from a problem you watch people have every day.","h":"/app/story/dm-champ/#ph1","g":"Phases"},{"t":"DM Champ \u00b7 phase 2: Wake up old leads","k":"Wake up old leads The founder cold-emailed local clinics (emailed businesses that didn't know him yet) using a tool called Instantly. Three were interested and he followed up with one. That clinic had fewer than 200 old leads; the AI messaged them on WhatsApp and the clinic started paying every month. The product was first called Whatz.ai, and in 2024 the homepage still sold exactly this. Start with a result a business can see in money, like customers who come back.","h":"/app/story/dm-champ/#ph2","g":"Phases"},{"t":"DM Champ \u00b7 phase 3: A cheap launch with lots of refunds","k":"A cheap launch with lots of refunds DM Champ went on AppSumo. It made about \u20ac20,000 from 300 customers, but 40% asked for refunds. The founder blames the cheapest tier, which 'attracted tire-kickers' (people who look but never really buy). Price too low and you attract people who were never going to use it.","h":"/app/story/dm-champ/#ph3","g":"Phases"},{"t":"DM Champ \u00b7 phase 4: One webinar, and ads that backfired","k":"One webinar, and ads that backfired A business coach the team knew ran a 60-minute webinar for 300 people. The founder says 'we had $20K in Stripe' two minutes after the offer went live, from 80 customers. Meta ads (Facebook and Instagram ads) closed 15% of leads, but those customers cancelled after three months. Someone else's audience that already trusts them can sell more in an hour than months of ads.","h":"/app/story/dm-champ/#ph4","g":"Phases"},{"t":"DM Champ \u00b7 phase 5: Stuck around $10K","k":"Stuck around $10K In mid-2025 the homepage dared visitors: 'Find Us an AI Sales Agent More Human than Ours and We'll Send You $100'. In March 2026 the founder told Starter Story the business made about $10,000 a month. Stripe agrees: monthly revenue stayed between $6,241 and $12,263 from December 2025 to September 2026. A clever headline gets attention, but it doesn't change who your customer is.","h":"/app/story/dm-champ/#ph5","g":"Phases"},{"t":"DM Champ \u00b7 phase 6: Sell to agencies instead","k":"Sell to agencies instead By July 2026 the homepage spoke to agencies: put your own logo on the AI and resell it to your clients. The founder calls the 2026 AppSumo launch its third, and says 'What we used to make in a year, we now make in a month.' Stripe revenue nearly tripled in October 2026. Sometimes the fix is a new buyer, not a new feature: sell to the people who sell to everyone else.","h":"/app/story/dm-champ/#ph6","g":"Phases"},{"t":"DM Champ move 1: Cold-emailed local clinics and signed one at about \u20ac2,000 a month \u00b7 Early on (date not public)","h":"/app/story/dm-champ/#chart","g":"Moves"},{"t":"DM Champ move 2: Homepage pitch: win back lost customers on WhatsApp (renamed from Whatz.ai) \u00b7 Aug 2024","h":"/app/story/dm-champ/#chart","g":"Moves"},{"t":"DM Champ move 3: First AppSumo lifetime deal: about \u20ac20K, 300 customers, 40% refunds \u00b7 2024","h":"/app/story/dm-champ/#chart","g":"Moves"},{"t":"DM Champ move 4: Affiliate webinar with a business coach: $20K and 80 customers \u00b7 Not public","h":"/app/story/dm-champ/#chart","g":"Moves"},{"t":"DM Champ move 5: Tried Meta ads; customers cancelled after three months, so the AI was changed to turn away poor-fit leads \u00b7 Not public","h":"/app/story/dm-champ/#chart","g":"Moves"},{"t":"DM Champ move 6: New homepage dare: find a more human AI sales agent and we'll send you $100 \u00b7 Jul 2025","h":"/app/story/dm-champ/#chart","g":"Moves"},{"t":"DM Champ move 7: Relaunched on AppSumo and repositioned as a white-label tool agencies resell \u00b7 2026","h":"/app/story/dm-champ/#chart","g":"Moves"},{"t":"DM Champ \u00b7 TrustMRR: DM Champ","k":"TrustMRR: DM Champ MRR, all-time revenue, monthly series, founder count","h":"/app/story/dm-champ/#sources","g":"Sources"},{"t":"DM Champ \u00b7 Starter Story interview","k":"Starter Story interview Origin, cold email, first clinic, AppSumo, webinar, Meta ads, ~$10K/mo, team","h":"/app/story/dm-champ/#sources","g":"Sources"},{"t":"DM Champ \u00b7 AppSumo: DM Champ","k":"AppSumo: DM Champ Lifetime deal prices, founding date, founder posts ('third time on AppSumo', '$600K')","h":"/app/story/dm-champ/#sources","g":"Sources"},{"t":"DM Champ \u00b7 Wayback Machine: dmchamp.com","k":"Wayback Machine: dmchamp.com Homepage headlines, Aug 2024 to Jul 2026","h":"/app/story/dm-champ/#sources","g":"Sources"},{"t":"Windmill Growth \u00b7 phase 1: A cheap first offer","k":"A cheap first offer Windmill started by promoting founders' LinkedIn posts. The founder wrote the post, and Windmill made sure it got lots of likes and comments fast, so LinkedIn showed it to more people. That cost $500 a month. Writing the posts for you (ghostwriting) was the bigger plan at $1,800 a month. Don't copy the likes part: paying for likes and comments can break a platform's rules and makes people trust the post less. The useful idea is the cheap first offer. Start with a small, cheap offer that's easy to say yes to, then offer more to the people who stay.","h":"/app/story/windmill-growth/#ph1","g":"Phases"},{"t":"Windmill Growth \u00b7 phase 2: Bigger plans for bigger clients","k":"Bigger plans for bigger clients By January 2025 the cheap plan was $650 a month and the top plans were $4,999 and $7,499, aimed at companies with $2M+ in yearly revenue. The homepage said 'Trusted by 100+ Founders and Executives' and '7 spots left for January'. A case studies page was archived in February 2025. Once a cheap offer works, add a bigger version for customers who can pay more.","h":"/app/story/windmill-growth/#ph2","g":"Phases"},{"t":"Windmill Growth \u00b7 phase 3: A free tool as bait","k":"A free tool as bait In April 2025 a podcast said Windmill had gone from zero to '$1M+ ARR in under a year', fully bootstrapped. ARR means yearly recurring revenue. A free 'AI Profile Optimizer' for LinkedIn went live around March 2025, and by August it was the banner at the top of the homepage. A free tool that solves a tiny problem brings in people who might buy the big solution.","h":"/app/story/windmill-growth/#ph3","g":"Phases"},{"t":"Windmill Growth \u00b7 phase 4: Writing for Google too","k":"Writing for Google too Windmill published dozens of guides like 'LinkedIn ghostwriter cost' and 'Best times to post on LinkedIn in 2026', the questions buyers type into Google. In April 2026 the homepage said it 'works with the top 0.1% of startup founders'. Monthly revenue stayed close to $100K. Write the answers to the exact questions your buyers search for.","h":"/app/story/windmill-growth/#ph4","g":"Phases"},{"t":"Windmill Growth \u00b7 phase 5: Steady growth, one main plan","k":"Steady growth, one main plan Revenue rose slowly from about $108K to $118K a month. The site now leads with 'Your LinkedIn brand. Without the AI accent.' and the most popular plan is $3,999 a month. It says it has worked with 185+ founders and keeps 30 on the books at a time. When everyone uses AI to write, sounding like a real person becomes the thing you sell.","h":"/app/story/windmill-growth/#ph5","g":"Phases"},{"t":"Windmill Growth move 1: Had a payment page up on the founding date \u00b7 May 2024","h":"/app/story/windmill-growth/#chart","g":"Moves"},{"t":"Windmill Growth move 2: Sold a $500/mo post-promotion service as the way in, with ghostwriting as the upgrade \u00b7 Aug 2024","h":"/app/story/windmill-growth/#chart","g":"Moves"},{"t":"Windmill Growth move 3: Added $4,999 and $7,499 plans for bigger companies and used 'spots left' to create urgency \u00b7 Jan 2025","h":"/app/story/windmill-growth/#chart","g":"Moves"},{"t":"Windmill Growth move 4: Published client case studies \u00b7 Feb 2025","h":"/app/story/windmill-growth/#chart","g":"Moves"},{"t":"Windmill Growth move 5: Launched a free AI LinkedIn profile optimizer \u00b7 Mar 2025","h":"/app/story/windmill-growth/#chart","g":"Moves"},{"t":"Windmill Growth move 6: Told the story on a podcast: $1M+ ARR in under a year, bootstrapped \u00b7 Apr 2025","h":"/app/story/windmill-growth/#chart","g":"Moves"},{"t":"Windmill Growth move 7: Started publishing guides that answer what buyers search on Google about LinkedIn ghostwriting \u00b7 Feb 2026","h":"/app/story/windmill-growth/#chart","g":"Moves"},{"t":"Windmill Growth move 8: Repositioned around human-sounding writing: 'Without the AI accent' \u00b7 Nov 2026","h":"/app/story/windmill-growth/#chart","g":"Moves"},{"t":"Windmill Growth \u00b7 TrustMRR: Windmill Growth","k":"TrustMRR: Windmill Growth MRR, revenue, monthly series, founder count","h":"/app/story/windmill-growth/#sources","g":"Sources"},{"t":"Windmill Growth \u00b7 TrustMRR: Windmill Growth (markdown profile)","k":"TrustMRR: Windmill Growth (markdown profile) Active subscriptions, founded date","h":"/app/story/windmill-growth/#sources","g":"Sources"},{"t":"Windmill Growth \u00b7 Turning Pro podcast, episode 77 (write-up)","k":"Turning Pro podcast, episode 77 (write-up) \"$1M+ ARR in under a year, fully bootstrapped\"","h":"/app/story/windmill-growth/#sources","g":"Sources"},{"t":"Windmill Growth \u00b7 Wayback: windmillgrowth.com","k":"Wayback: windmillgrowth.com Homepages and prices, Aug 2024 to Apr 2026","h":"/app/story/windmill-growth/#sources","g":"Sources"},{"t":"Windmill Growth \u00b7 Wayback: pay.windmillgrowth.com","k":"Wayback: pay.windmillgrowth.com Payment page on the founding date","h":"/app/story/windmill-growth/#sources","g":"Sources"},{"t":"Windmill Growth \u00b7 Windmill Growth homepage","k":"Windmill Growth homepage Current headline, price, 185+ founders claim","h":"/app/story/windmill-growth/#sources","g":"Sources"},{"t":"Stencil AI \u00b7 phase 1: A problem in the family","k":"A problem in the family Before every tattoo, artists trace the design by hand into a clean line drawing called a stencil, then transfer it onto skin. The team behind Stencil AI is two brothers. One is the programmer, the other is a tattoo artist, so the problem was sitting right next to the person who could code a fix. The best problems to solve are ones a friend or family member deals with every week.","h":"/app/story/stencil-ai/#ph1","g":"Phases"},{"t":"Stencil AI \u00b7 phase 2: Web first, paid from the start","k":"Web first, paid from the start The website was already online by September 2025. In February 2026 the homepage promised \"a perfect stencil in 30 seconds\" and there was no free plan: $14, $29 or $69 a month. The phone app was still marked \"Coming soon\". In January 2026 it already brought in about $16,000. You don't need an app store listing to start charging. A simple website with a price tests whether people will pay.","h":"/app/story/stencil-ai/#ph2","g":"Phases"},{"t":"Stencil AI \u00b7 phase 3: Selling to professionals","k":"Selling to professionals Stencil AI is sold to people who earn money with it. A Studio plan charges per artist, so a whole tattoo shop can pay for it. The pitch is time: the October 2026 homepage says it \"replaces hours of tracing in Procreate\", a drawing app. People pay more easily for a tool that saves them time at work than for one that is just fun.","h":"/app/story/stencil-ai/#ph3","g":"Phases"},{"t":"Stencil AI \u00b7 phase 4: The App Store launch","k":"The App Store launch The iPhone app went live on March 12, 2026, with an Android version too. Monthly revenue grew every month from January to July, from about $16,000 to about $62,000. Once the website proves people pay, an app puts the tool where the customer works: on a phone or tablet at the chair.","h":"/app/story/stencil-ai/#ph4","g":"Phases"},{"t":"Stencil AI \u00b7 phase 5: Holding steady and getting found","k":"Holding steady and getting found Since July, revenue has stayed between about $60,000 and $64,000 a month. The site has a blog of how-to guides, like how to print a stencil or make one in Procreate, so artists searching Google land on it. Its MRR was $48,693 when we read it, lower than October's $62,976. Both numbers are real but measure different things: MRR only counts subscriptions active on the day it was read, as a monthly amount, while a month's revenue is all the money collected that month, which can include yearly plans paid up front. The TrustMRR listing names app store search, SEO (getting found on Google), a blog, TikTok, Instagram, Pinterest and YouTube as its channels. Write the guide your customer is already searching for, and put your tool inside it.","h":"/app/story/stencil-ai/#ph5","g":"Phases"},{"t":"Stencil AI move 1: Put the website online (first Wayback captures on Sep 29 2025) \u00b7 By Sep 2025","h":"/app/story/stencil-ai/#chart","g":"Moves"},{"t":"Stencil AI move 2: Sold three paid plans on the web with no free plan, while the app was still \"Coming soon\" \u00b7 Feb 2026","h":"/app/story/stencil-ai/#chart","g":"Moves"},{"t":"Stencil AI move 3: Pointed an Instagram bio link at the site \u00b7 Feb 2026","h":"/app/story/stencil-ai/#chart","g":"Moves"},{"t":"Stencil AI move 4: Launched the iPhone app \u00b7 Mar 12 2026","h":"/app/story/stencil-ai/#chart","g":"Moves"},{"t":"Stencil AI move 5: Offered a per-artist Studio plan so whole tattoo shops can pay \u00b7 2026","h":"/app/story/stencil-ai/#chart","g":"Moves"},{"t":"Stencil AI move 6: Published how-to guides for tattoo artists on its own blog \u00b7 2026","h":"/app/story/stencil-ai/#chart","g":"Moves"},{"t":"Stencil AI move 7: Added in-app editing, true-size printing and a full-screen \"Tattoo Mode\" for use during a session \u00b7 By Oct 2026","h":"/app/story/stencil-ai/#chart","g":"Moves"},{"t":"Stencil AI \u00b7 TrustMRR: Stencil AI","k":"TrustMRR: Stencil AI MRR, revenue, monthly series, subscriptions","h":"/app/story/stencil-ai/#sources","g":"Sources"},{"t":"Stencil AI \u00b7 TrustMRR: Stencil AI (Markdown profile)","k":"TrustMRR: Stencil AI (Markdown profile) Founder-provided description, team size, founding date, channels, pricing","h":"/app/story/stencil-ai/#sources","g":"Sources"},{"t":"Stencil AI \u00b7 App Store: Stencil AI - Tattoo Stencils","k":"App Store: Stencil AI - Tattoo Stencils Rating and rating count","h":"/app/story/stencil-ai/#sources","g":"Sources"},{"t":"Stencil AI \u00b7 Apple lookup API","k":"Apple lookup API Release date Mar 12 2026","h":"/app/story/stencil-ai/#sources","g":"Sources"},{"t":"Stencil AI \u00b7 Wayback Machine: stencilai.app, Feb 1 2026","k":"Wayback Machine: stencilai.app, Feb 1 2026 Headline, prices, \"two brothers\" team section, app \"Coming soon\"","h":"/app/story/stencil-ai/#sources","g":"Sources"},{"t":"Stencil AI \u00b7 Wayback Machine: stencilai.app, Oct 11 2026","k":"Wayback Machine: stencilai.app, Oct 11 2026 Headline, prices, artist claims, team section","h":"/app/story/stencil-ai/#sources","g":"Sources"},{"t":"Stencil AI \u00b7 Wayback Machine: Instagram bio link capture","k":"Wayback Machine: Instagram bio link capture Site visited from an Instagram link in bio","h":"/app/story/stencil-ai/#sources","g":"Sources"},{"t":"Stencil AI \u00b7 Wayback Machine: capture list","k":"Wayback Machine: capture list First captures on Sep 29 2025","h":"/app/story/stencil-ai/#sources","g":"Sources"},{"t":"Stencil AI \u00b7 Stencil AI blog","k":"Stencil AI blog How-to guides for tattoo artists","h":"/app/story/stencil-ai/#sources","g":"Sources"},{"t":"Boothie \u00b7 phase 1: A simpler app first?","k":"A simpler app first? In April 2025 a free iPhone app also called Boothie appeared: a plain vintage photobooth that takes three shots and makes a photo strip, with no AI. It came from a different developer account, and its code is public on GitHub. We couldn't confirm it is the same team, so treat this as a maybe. A small free version is a cheap way to test a name and an idea before you add the expensive part.","h":"/app/story/boothie/#ph1","g":"Phases"},{"t":"Boothie \u00b7 phase 2: Launch into a trend","k":"Launch into a trend The AI app launched on June 23, 2026. You pick a look, like a 2000s digicam flash, Kodak film or a vintage photobooth, take a selfie, and get it back in that style. The basic editor is free. The AI looks cost credits, through weekly subscriptions or credit packs. It earned $4,727 in its first week. When a look is already trending, a tool that makes that exact look in one tap is easy to explain.","h":"/app/story/boothie/#ph2","g":"Phases"},{"t":"Boothie \u00b7 phase 3: TikTok does the selling","k":"TikTok does the selling The app is aimed at women 16 to 40 who post on TikTok and Instagram, and TikTok is its only listed marketing channel. A sale listing says growth came from TikTok photo carousels (posts you swipe through) posted by almost a dozen accounts in the US, Germany and Turkey. The website even tells visitors how to escape TikTok's built-in browser to reach the App Store. Revenue jumped to $27,283 in July and $43,716 in August. Show the before and after where your customer already scrolls. If your posts come from made-up characters, say so, or you risk losing trust and breaking the platform's rules.","h":"/app/story/boothie/#ph3","g":"Phases"},{"t":"Boothie \u00b7 phase 4: Android and the best month","k":"Android and the best month An Android version came out on Google Play in September 2026, and a proper website went up by early October. October was the best month so far at $56,432. Once one platform works, the next one can add customers without new marketing.","h":"/app/story/boothie/#ph4","g":"Phases"},{"t":"Boothie \u00b7 phase 5: Selling the business","k":"Selling the business On October 9, 2026, about 15 weeks after launch, Boothie was listed for sale on TrustMRR. The asking price there is $900,000, and it had received 32 offers. A different site lists it at $2,000,000. Trend apps can fade fast, so some founders sell while the numbers are high. In November the same developer account released a new app, a photo cleaner called Swipezy. An app is an asset: if you build something that earns, someone may pay you for it.","h":"/app/story/boothie/#ph5","g":"Phases"},{"t":"Boothie move 1: A free vintage photobooth app called Boothie appears on the App Store (link to this team not confirmed) \u00b7 Apr 2025","h":"/app/story/boothie/#chart","g":"Moves"},{"t":"Boothie move 2: Launched the AI version on iPhone with a free editor and paid AI looks \u00b7 Jun 23 2026","h":"/app/story/boothie/#chart","g":"Moves"},{"t":"Boothie move 3: Grew through TikTok photo carousels from about a dozen accounts \u00b7 Summer 2026","h":"/app/story/boothie/#chart","g":"Moves"},{"t":"Boothie move 4: Launched on Google Play \u00b7 Sep 2026","h":"/app/story/boothie/#chart","g":"Moves"},{"t":"Boothie move 5: Put up a website with a tip for opening the App Store from TikTok's browser \u00b7 By Oct 9 2026","h":"/app/story/boothie/#chart","g":"Moves"},{"t":"Boothie move 6: Listed the business for sale on TrustMRR \u00b7 Oct 9 2026","h":"/app/story/boothie/#chart","g":"Moves"},{"t":"Boothie move 7: The same developer account released a second app, Swipezy \u00b7 Nov 4 2026","h":"/app/story/boothie/#chart","g":"Moves"},{"t":"Boothie \u00b7 TrustMRR: Boothie","k":"TrustMRR: Boothie MRR, revenue, monthly series, subscriptions","h":"/app/story/boothie/#sources","g":"Sources"},{"t":"Boothie \u00b7 TrustMRR: Boothie (Markdown profile)","k":"TrustMRR: Boothie (Markdown profile) Founder-provided description, audience, channel, Android date, sale listing","h":"/app/story/boothie/#sources","g":"Sources"},{"t":"Boothie \u00b7 App Store: Boothie: AI Photo Editor","k":"App Store: Boothie: AI Photo Editor App listing","h":"/app/story/boothie/#sources","g":"Sources"},{"t":"Boothie \u00b7 Apple lookup API: Boothie","k":"Apple lookup API: Boothie Release date Jun 23 2026, rating count","h":"/app/story/boothie/#sources","g":"Sources"},{"t":"Boothie \u00b7 Apple lookup API: developer's apps","k":"Apple lookup API: developer's apps Second app Swipezy, released Nov 4 2026","h":"/app/story/boothie/#sources","g":"Sources"},{"t":"Boothie \u00b7 Apple lookup API: earlier Boothie photobooth app","k":"Apple lookup API: earlier Boothie photobooth app Released Apr 22 2025, different developer account","h":"/app/story/boothie/#sources","g":"Sources"},{"t":"Boothie \u00b7 GitHub: earlier Boothie photobooth code","k":"GitHub: earlier Boothie photobooth code \"Vintage photobooth app built with SwiftUI\"","h":"/app/story/boothie/#sources","g":"Sources"},{"t":"Boothie \u00b7 Founder's GitHub profile","k":"Founder's GitHub profile \"Built with my partner, grown by word of mouth\"","h":"/app/story/boothie/#sources","g":"Sources"},{"t":"Boothie \u00b7 whatsthe.app: Boothie sale listing","k":"whatsthe.app: Boothie sale listing TikTok carousel growth claim, $2M asking price","h":"/app/story/boothie/#sources","g":"Sources"},{"t":"Boothie \u00b7 Wayback Machine: boothieapp.com, Oct 9 2026","k":"Wayback Machine: boothieapp.com, Oct 9 2026 Headline, pricing model, TikTok browser tip","h":"/app/story/boothie/#sources","g":"Sources"},{"t":"Mindset \u00b7 phase 1: YouTube first","k":"YouTube first One of the co-founders started a motivational speech channel on YouTube in 2016 as a side hobby. One of his first videos got a million views in its first month. He built more channels after that, including one for students. An audience you build for free can become the first customers of anything you make later.","h":"/app/story/mindset/#ph1","g":"Phases"},{"t":"Mindset \u00b7 phase 2: Testing quietly","k":"Testing quietly The app went on the App Store in January 2020, but the team didn't announce it yet. Thousands of listeners tested it for months first. By then the team had deals with more than 20 YouTube channels to use their speeches, and a royalty system to pay those creators. Let real users test before the big launch. Fix what they hate while few people are watching.","h":"/app/story/mindset/#ph2","g":"Phases"},{"t":"Mindset \u00b7 phase 3: The official launch","k":"The official launch On November 15, 2020, the team announced Mindset as an app from \"the world's biggest motivational YouTube network\". They said the partner channels had over 13 million subscribers combined. At first, the speeches were free to play. If you already have an audience, a launch is just telling them where to go next.","h":"/app/story/mindset/#ph3","g":"Phases"},{"t":"Mindset \u00b7 phase 4: Slow, steady growth","k":"Slow, steady growth In March 2022 the app added Skills: you earn points and level up in eight life areas. By May 2022 it had passed 100,000 users and about 300,000 audio plays a month. That's roughly a year and a half after launch, even with a huge YouTube audience. Even with a head start, expect years of building, not weeks.","h":"/app/story/mindset/#ph4","g":"Phases"},{"t":"Mindset \u00b7 phase 5: Alarms, streaks and subscriptions","k":"Alarms, streaks and subscriptions Today the app leads with an alarm clock that wakes you to a famous speech, plus streaks, widgets and leaderboards. It charges $4.99 a week, $9.99 a month or $59.99 a year. MRR means monthly recurring revenue: money that comes in every month from subscriptions. Mindset's is $24,251. A month's revenue can be higher, because it counts all money collected that month, including yearly plans paid up front. Revenue moves between about $16,000 and $35,000 a month. Features that bring people back every day, like an alarm or a streak, are what keep a subscription alive.","h":"/app/story/mindset/#ph5","g":"Phases"},{"t":"Mindset move 1: Started a motivational speech channel on YouTube as a side project \u00b7 2016","h":"/app/story/mindset/#chart","g":"Moves"},{"t":"Mindset move 2: Put the app on the App Store and let listeners test it for months \u00b7 Jan 15 2020","h":"/app/story/mindset/#chart","g":"Moves"},{"t":"Mindset move 3: Signed content deals with 20+ YouTube channels and set up a royalty system to pay them \u00b7 2020","h":"/app/story/mindset/#chart","g":"Moves"},{"t":"Mindset move 4: Officially launched with a press release, speeches free to play \u00b7 Nov 15 2020","h":"/app/story/mindset/#chart","g":"Moves"},{"t":"Mindset move 5: Added Skills: points and levels across eight life areas \u00b7 Mar 2022","h":"/app/story/mindset/#chart","g":"Moves"},{"t":"Mindset move 6: Added a motivational alarm clock, streaks, widgets and global leaderboards \u00b7 By 2026","h":"/app/story/mindset/#chart","g":"Moves"},{"t":"Mindset move 7: Uses YouTube, Facebook, Instagram and TikTok for marketing, plus paid ads \u00b7 2026","h":"/app/story/mindset/#chart","g":"Moves"},{"t":"Mindset \u00b7 TrustMRR: Mindset App","k":"TrustMRR: Mindset App MRR, revenue, monthly series, subscriptions","h":"/app/story/mindset/#sources","g":"Sources"},{"t":"Mindset \u00b7 TrustMRR: Mindset App (Markdown profile)","k":"TrustMRR: Mindset App (Markdown profile) Founder-provided description, founding date, team size, pricing, users, channels","h":"/app/story/mindset/#sources","g":"Sources"},{"t":"Mindset \u00b7 App Store: Mindset: Daily Motivation App","k":"App Store: Mindset: Daily Motivation App Features, alarm clock","h":"/app/story/mindset/#sources","g":"Sources"},{"t":"Mindset \u00b7 Apple lookup API","k":"Apple lookup API Release date Jan 15 2020, 2,809 ratings","h":"/app/story/mindset/#sources","g":"Sources"},{"t":"Mindset \u00b7 PR.com: launch press release","k":"PR.com: launch press release Official launch, co-founders' backgrounds, partner channels, self-funded","h":"/app/story/mindset/#sources","g":"Sources"},{"t":"Mindset \u00b7 Mindset App on Medium (Wayback copy)","k":"Mindset App on Medium (Wayback copy) 100,000 users, Skills feature, founded 2019","h":"/app/story/mindset/#sources","g":"Sources"},{"t":"Mindset \u00b7 Co-founder's site: My Story","k":"Co-founder's site: My Story How the YouTube channels started in 2016","h":"/app/story/mindset/#sources","g":"Sources"},{"t":"Mindset \u00b7 The Icons podcast episode","k":"The Icons podcast episode YouTube company revenue claim","h":"/app/story/mindset/#sources","g":"Sources"},{"t":"Mindset \u00b7 Wayback Machine: mindsetapp.com, Dec 31 2020","k":"Wayback Machine: mindsetapp.com, Dec 31 2020 Homepage headline","h":"/app/story/mindset/#sources","g":"Sources"},{"t":"Mindset \u00b7 Wayback Machine: mindsetapp.com, Jul 5 2023","k":"Wayback Machine: mindsetapp.com, Jul 5 2023 Homepage headline","h":"/app/story/mindset/#sources","g":"Sources"},{"t":"Mindset \u00b7 Wayback Machine: mindsetapp.com, Aug 5 2026","k":"Wayback Machine: mindsetapp.com, Aug 5 2026 Homepage headline and user claims","h":"/app/story/mindset/#sources","g":"Sources"},{"t":"Gojiberry \u00b7 phase 1: Done it before","k":"Done it before The founders' earlier company, Coco AI, sold WhatsApp marketing to online shops. It reached about \u20ac500,000 a year in revenue through cold outreach (messaging people who didn't know them yet) and was sold to an American fund. So they already knew how to find customers by messaging them directly. Skills carry over: what you learn selling one thing makes the next thing easier to sell.","h":"/app/story/gojiberry/#ph1","g":"Phases"},{"t":"Gojiberry \u00b7 phase 2: The waitlist that made $0","k":"The waitlist that made $0 Version one was an AI sales assistant that joined calls, took notes and filled in the CRM (the software sales teams use to track customers). The homepage asked people to join a waitlist, and it grew from 1,147 in April to over 2,000 in May. When it launched, none of them paid. A signup is not a sale. Ask for money as early as you can.","h":"/app/story/gojiberry/#ph2","g":"Phases"},{"t":"Gojiberry \u00b7 phase 3: Rebuild in weeks","k":"Rebuild in weeks The team threw out the note-taker and rebuilt the product from scratch around one job: find people on LinkedIn who are showing signs they want to buy, and hand over their contact details. By June the homepage said 'Trusted by 30+ B2B companies'. By July it said 100+. When nobody pays, change the product, not just the marketing.","h":"/app/story/gojiberry/#ph3","g":"Phases"},{"t":"Gojiberry \u00b7 phase 4: Reddit first","k":"Reddit first The co-founder posted stories on Reddit instead of ads: what $1,250 of LinkedIn influencer posts got him, and being turned down by Y Combinator (a famous program that invests in startups) after an interview. He warmed up each account for 1 to 2 weeks before posting and replied to every comment. He says Reddit brought 11 million views and 40,000+ visitors. Tell true stories with proof; a rejection can be your best post.","h":"/app/story/gojiberry/#ph4","g":"Phases"},{"t":"Gojiberry \u00b7 phase 5: Twelve channels at once","k":"Twelve channels at once Once Reddit worked, the team added everything: 5,000 cold emails a day, about 800 LinkedIn messages a week from five accounts using its own tool, daily posts, five YouTube videos a week, SEO (getting found on Google), newsletters, influencers and affiliates (people paid a cut for each customer they bring). Most customers were on a $99-a-month plan. Use your own product to sell your product; it is the best demo you have.","h":"/app/story/gojiberry/#ph5","g":"Phases"},{"t":"Gojiberry \u00b7 phase 6: Y Combinator and fast growth","k":"Y Combinator and fast growth Gojiberry joined Y Combinator's Spring 2026 batch. Revenue roughly doubled every two to three months. The homepage count went from '500+ small sales teams' in March 2026 to '3,500+ growing B2B sales teams' in November. Getting turned down once is not the end; apply again with better numbers.","h":"/app/story/gojiberry/#ph6","g":"Phases"},{"t":"Gojiberry move 1: Collected a 2,000+ waitlist for an AI meeting assistant that then made $0 \u00b7 Apr to May 2025","h":"/app/story/gojiberry/#chart","g":"Moves"},{"t":"Gojiberry move 2: Rebuilt the product around LinkedIn buying signals \u00b7 Jun 2025","h":"/app/story/gojiberry/#chart","g":"Moves"},{"t":"Gojiberry move 3: Posted founder stories on Reddit and replied to every comment \u00b7 2025","h":"/app/story/gojiberry/#chart","g":"Moves"},{"t":"Gojiberry move 4: Ran its own tool for its own LinkedIn outreach, about 800 messages a week \u00b7 2025","h":"/app/story/gojiberry/#chart","g":"Moves"},{"t":"Gojiberry move 5: Sent about 5,000 cold emails a day \u00b7 2025","h":"/app/story/gojiberry/#chart","g":"Moves"},{"t":"Gojiberry move 6: Paid for an ad spot on TrustMRR, which it says sent 50 to 100 visitors a day \u00b7 Late 2025","h":"/app/story/gojiberry/#chart","g":"Moves"},{"t":"Gojiberry move 7: Joined Y Combinator (Spring 2026 batch) \u00b7 2026","h":"/app/story/gojiberry/#chart","g":"Moves"},{"t":"Gojiberry \u00b7 TrustMRR: Gojiberry (listed as Superfruits)","k":"TrustMRR: Gojiberry (listed as Superfruits) MRR, all-time revenue, monthly series, founder count (last synced Aug 14 2026)","h":"/app/story/gojiberry/#sources","g":"Sources"},{"t":"Gojiberry \u00b7 Superframeworks case study","k":"Superframeworks case study Previous company, waitlist, rebuild, 12 channels, $33K in 4 months","h":"/app/story/gojiberry/#sources","g":"Sources"},{"t":"Gojiberry \u00b7 We Are Founders article","k":"We Are Founders article 2,000 waitlist, zero sales, 100+ customers in 60 days","h":"/app/story/gojiberry/#sources","g":"Sources"},{"t":"Gojiberry \u00b7 Starter Story video: How I Used Reddit to Build a $34K/Month SaaS","k":"Starter Story video: How I Used Reddit to Build a $34K/Month SaaS Reddit tactics, 11M views, 40K visitors, $99 plan","h":"/app/story/gojiberry/#sources","g":"Sources"},{"t":"Gojiberry \u00b7 Y Combinator: Gojiberry AI","k":"Y Combinator: Gojiberry AI Spring 2026 batch, team of 7, $112K MRR and $2.5M ARR claims","h":"/app/story/gojiberry/#sources","g":"Sources"},{"t":"Gojiberry \u00b7 ARR Club: Gojiberry ARR hit $2M","k":"ARR Club: Gojiberry ARR hit $2M $2M ARR claim, citing the co-founder's X post","h":"/app/story/gojiberry/#sources","g":"Sources"},{"t":"Gojiberry \u00b7 Wayback Machine: gojiberry.ai","k":"Wayback Machine: gojiberry.ai Homepage headlines and customer counts, Apr 2025 to Nov 2026","h":"/app/story/gojiberry/#sources","g":"Sources"},{"t":"Postiz \u00b7 phase 1: Before Postiz","k":"Before Postiz The founder was a growth marketer at Novu, another open-source company (it shares its code free for anyone to use), where the project grew to 30,000 GitHub stars (like bookmarks on GitHub, the site where code is shared) in two years. His first solo product, Gitroom, made some money but \"the market was tiny\". He dropped it after about six months. Start where you already understand how people find things. Drop a product quickly when the market is too small.","h":"/app/story/postiz/#ph1","g":"Phases"},{"t":"Postiz \u00b7 phase 2: Building","k":"Building Postiz started as a regular social media scheduler for creators, businesses and agencies. He spent about $12,000 on SEO articles (articles meant to rank on Google) for a brand-new website. They brought almost no traffic, and he stopped. A new domain has no authority with Google. Paying for SEO in month one is usually money gone.","h":"/app/story/postiz/#ph2","g":"Phases"},{"t":"Postiz \u00b7 phase 3: Open source","k":"Open source He open-sourced it and ran launch weeks on Hacker News, Reddit, Dev.to and Product Hunt (sites where people share new projects) to reach GitHub's trending page. Reddit users asked for a Docker setup (an easy way to install it on a server), so he built one. GitHub stars went from about 3K to 14K in three months. Free gets attention, but attention is not revenue. Expect a long stretch where the free version grows and the paid version barely moves.","h":"/app/story/postiz/#ph3","g":"Phases"},{"t":"Postiz \u00b7 phase 4: Finding the users who stay","k":"Finding the users who stay He noticed people using Postiz inside n8n automations (n8n connects apps so tasks run by themselves) and YouTube tutorials about automating social media. He published an official n8n node, improved the public API (the way other software talks to Postiz), messaged Skool communities (paid online groups) to promote Postiz, and started an affiliate program (people who bring in customers get a cut) paying about 30% every month for as long as the customer stays.\n\nHis reasoning: people posting by hand cancel, but \"when people are posting with automation, that's a whole different story.\" Look at who your most active users are, then build for them.","h":"/app/story/postiz/#ph4","g":"Phases"},{"t":"Postiz \u00b7 phase 5: The turning point","k":"The turning point OpenClaw, an AI agent project, went viral. Postiz was ready with an MCP server (a way for AI agents to use Postiz), a command-line tool (you control it by typing commands) and an OpenClaw skill. A third-party writer published a popular article about an agent that posted TikTok slideshows through Postiz. You can't plan a viral moment, but you can be the tool that's ready when one happens.","h":"/app/story/postiz/#ph5","g":"Phases"},{"t":"Postiz \u00b7 phase 6: Scaling the content","k":"Scaling the content A weekly system on X: a Monday video that is useful on its own and only mentions Postiz, clips of it all week, then the same idea as a long X article the next week. He replies to every comment, and runs daily short videos through creators, where he says about 1 in 30 takes off. One idea, repackaged several times, beats new content every day.","h":"/app/story/postiz/#ph6","g":"Phases"},{"t":"Postiz move 1: Starts building Postiz \u00b7 Jan 2024","h":"/app/story/postiz/#chart","g":"Moves"},{"t":"Postiz move 2: $12K on SEO, little traffic \u00b7 2024","h":"/app/story/postiz/#chart","g":"Moves"},{"t":"Postiz move 3: Open-sources it \u00b7 Sep 2024","h":"/app/story/postiz/#chart","g":"Moves"},{"t":"Postiz move 4: n8n node, API, affiliates \u00b7 2025","h":"/app/story/postiz/#chart","g":"Moves"},{"t":"Postiz move 5: $14K a month, burned out \u00b7 Nov 2025","h":"/app/story/postiz/#chart","g":"Moves"},{"t":"Postiz move 6: Ready for the OpenClaw wave \u00b7 Early 2026","h":"/app/story/postiz/#chart","g":"Moves"},{"t":"Postiz move 7: Weekly X content system \u00b7 Sep 2026","h":"/app/story/postiz/#chart","g":"Moves"},{"t":"Postiz move 8: $430,896 a month \u00b7 Nov 17 2026","h":"/app/story/postiz/#chart","g":"Moves"},{"t":"Postiz \u00b7 TrustMRR: Postiz","k":"TrustMRR: Postiz Revenue, subscriptions, start date, price.","h":"/app/story/postiz/#sources","g":"Sources"},{"t":"Postiz \u00b7 GitHub: gitroomhq/postiz-app","k":"GitHub: gitroomhq/postiz-app 41,810 stars.","h":"/app/story/postiz/#sources","g":"Sources"},{"t":"Postiz \u00b7 Wayback Machine: postiz.com","k":"Wayback Machine: postiz.com Homepage and pricing, then and now.","h":"/app/story/postiz/#sources","g":"Sources"},{"t":"Postiz \u00b7 The founder on Dev.to","k":"The founder on Dev.to Open-source rules, Docker, n8n, Skool, affiliates, revenue to $14K.","h":"/app/story/postiz/#sources","g":"Sources"},{"t":"Postiz \u00b7 Mixergy interview","k":"Mixergy interview The OpenClaw turning point, the command-line tool, \"$45,000 per month\".","h":"/app/story/postiz/#sources","g":"Sources"},{"t":"Postiz \u00b7 Superframeworks case study","k":"Superframeworks case study Gitroom, the SEO spend, stars, monthly revenue through July 2026.","h":"/app/story/postiz/#sources","g":"Sources"},{"t":"Postiz \u00b7 Postiz blog","k":"Postiz blog The X content system, short-video creators, a $186,713 Stripe chart.","h":"/app/story/postiz/#sources","g":"Sources"}]}</script>
