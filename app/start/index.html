 buyer, not a new feature: sell to the people who sell to everyone else."],"hv":"$28,426","hu":" in Oct 2026","hl":"Verified","hd":"Nov 18 2026","hm":"Revenue in Oct 2026","hs":"TrustMRR","first":"Cold email","firstl":"Claimed","sub":"MRR $135,927 \u00b7 Nov 18 2026","status":"ready","stale":"","href":"/app/story/dm-champ/","read":8,"published":"2026-11-19","mrr":135927,"growth":8.8,"spark":"<svg class=\"spark\" viewBox=\"0 0 240 36\" preserveAspectRatio=\"none\" aria-hidden=\"true\"><path class=\"ar\" d=\"M2.0 21.1 L25.6 26.9 L49.2 24.4 L72.8 23.1 L96.4 25.3 L120.0 26.5 L143.6 25.5 L167.2 26.6 L190.8 27.4 L214.4 23.5 L238.0 4.0 L238.0 36 L2 36 Z\"/><path class=\"ln\" d=\"M2.0 21.1 L25.6 26.9 L49.2 24.4 L72.8 23.1 L96.4 25.3 L120.0 26.5 L143.6 25.5 L167.2 26.6 L190.8 27.4 L214.4 23.5 L238.0 4.0\"/></svg>","phases":6,"site":"https://dmchamp.com"},{"slug":"windmill-growth","name":"Windmill Growth","title":"Windmill Growth started with a $500-a-month LinkedIn service and now brings in about $118K a month","tab":"services","type":"Service","what":"A marketing agency (a company hired to do marketing for clients) that grows founders' personal brands, mainly on LinkedIn.","logo":"/assets/logos/windmillgrowth.png","pattern":"Start with a small, cheap service, then sell the bigger one","lessons":["Start with a small, cheap offer that's easy to say yes to, then offer more to the people who stay.","Once a cheap offer works, add a bigger version for customers who can pay more.","A free tool that solves a tiny problem brings in people who might buy the big solution.","Write the answers to the exact questions your buyers search for.","When everyone uses AI to write, sounding like a real person becomes the thing you sell."],"hv":"$118,047","hu":" in Oct 2026","hl":"Verified","hd":"Nov 18 2026","hm":"Revenue in Oct 2026","hs":"TrustMRR","first":"not public","firstl":"","sub":"MRR $119,347 \u00b7 Nov 18 2026","status":"ready","stale":"","href":"/app/story/windmill-growth/","read":8, d the audience first, then the app","lessons":["An audience you build for free can become the first customers of anything you make later.","Let real users test before the big launch. Fix what they hate while few people are watching.","If you already have an audience, a launch is just telling them where to go next.","Even with a head start, expect years of building, not weeks.","Features that bring people back every day, like an alarm or a streak, are what keep a subscription alive."],"hv":"$30,780","hu":" in Oct 2026","hl":"Verified","hd":"Nov 18 2026","hm":"Revenue in Oct 2026","hs":"TrustMRR","first":"Listeners of the founders' YouTube motivation channels","firstl":"Claimed","sub":"MRR $24,251 \u00b7 Nov 18 2026","status":"ready","stale":"","href":"/app/story/mindset/","read":8,"published":"2026-11-19","mrr":24251,"growth":5.7,"spark":"<svg class=\"spark\" viewBox=\"0 0 240 36\" preserveAspectRatio=\"none\" aria-hidden=\"true\"><path class=\"ar\" d=\"M2.0 18.9 L25.6 5.6 L49.2 17.5 L72.8 14.0 L96.4 18.4 L120.0 18.2 L143.6 20.1 L167.2 14.1 L190.8 15.1 L214.4 4.0 L238.0 7.6 L238.0 36 L2 36 Z\"/><path class=\"ln\" d=\"M2.0 18.9 L25.6 5.6 L49.2 17.5 L72.8 14.0 L96.4 18.4 L120.0 18.2 L143.6 20.1 L167.2 14.1 L190.8 15.1 L214.4 4.0 L238.0 7.6\"/></svg>","phases":5,"site":"https://mindsetapp.com"},{"slug":"gojiberry","name":"Gojiberry","title":"Gojiberry's waitlist of 2,000 paid nothing. A rebuild took it to $407K in one month","tab":"ai","type":"AI tool","what":"Finds B2B buyers (people buying for their company) who are showing buying signals on LinkedIn, so sales teams know who to message.","logo":"/assets/logos/gojiberry.png","pattern":"Throw away the first version when nobody pays","lessons":["Skills carry over: what you learn selling one thing makes the next thing easier to sell.","A signup is not a sale. Ask for money as early as you can.","When nobody pays, change the product, not just the marketing.","Tell true stories with proof; a rejection can be your best post.","Use your own product to sell your product; it is the best demo you have.","Getting turned down once is not the end; apply again with better numbers."],"hv":"$407,786","hu":" in Jul 2026","hl":"Verified","hd":"Aug 14 2026","hm":"Revenue in Jul 2026","hs":"TrustMRR","first":"A $0 waitlist, then a rebuild","firstl":"Claimed","sub":"MRR $424,368 \u00b7 Aug 14 2026","status":"ready","stale":"Stale \u00b7 last synced Aug 14 2026","href":"/app/story/gojiberry/","read":8,"published":"2026-11-19","mrr":424368,"growth":53.3,"spark":"<svg class=\"spark\" viewBox=\"0 0 240 36\" preserveAspectRatio=\"none\" aria-hidden=\"true\"><path class=\"ar\" d=\"M2.0 33.0 L31.5 31.8 L61.0 30.0 L90.5 26.3 L120.0 23.4 L149.5 19.0 L179.0 14.9 L208.5 8.9 L238.0 4.0 L238.0 36 L2 36 Z\"/><path class=\"ln\" d=\"M2.0 33.0 L31.5 31.8 L61.0 30.0 L90.5 26.3 L120.0 23.4 L149.5 19.0 L179.0 14.9 L208.5 8.9 L238.0 4.0\"/></svg>","phases":6,"site":"https://gojiberry.ai"},{"slug":"postiz","name":"Postiz","title":"Postiz: almost two years under $15K a month, then $431K","tab":null,"type":"Open source","what":"A social media scheduler built by one main developer. Free to self-host (run it on your own server), paid to use hosted.","logo":"/assets/logos/postiz.svg","pattern":"Give it away free, charge for the easy version","lessons":["Start where you already understand how people find things. Drop a product quickly when the market is too small.","A new domain has no authority with Google. Paying for SEO in month one is usually money gone.","Free gets attention, but attention is not revenue. Expect a long stretch where the free version grows and the paid version barely moves.","Look at who your most active users are, then build for them.","You can't plan a viral moment, but you can be the tool that's ready when one happens.","One idea, repackaged several times, beats new content every day."],"hv":"$430,896","hu":" MRR","hl":"Verified","hd":"Nov 17 2026","hm":"MRR","hs":"TrustMRR","first":"Open-source launch weeks","firstl":"Claimed","sub":"","status":"ready","stale":"","href":"/app/story/postiz/","read":10,"published":"2026-11-17","mrr":430896,"growth":28.0,"spark":"<svg class=\"spark\" viewBox=\"0 0 240 36\" preserveAspectRatio=\"none\" aria-hidden=\"true\"><path class=\"ar\" d=\"M2.0 34.0 L28.2 33.5 L54.4 33.1 L80.7 33.0 L106.9 32.5 L133.1 28.4 L159.3 25.8 L185.6 23.9 L211.8 21.0 L238.0 4.0 L238.0 36 L2 36 Z\"/><path class=\"ln\" d=\"M2.0 34.0 L28.2 33.5 L54.4 33.1 L80.7 33.0 L106.9 32.5 L133.1 28.4 L159.3 25.8 L185.6 23.9 L211.8 21.0 L238.0 4.0\"/></svg>","phases":6,"site":"https://postiz.com"}],"tabs":{"ai":"AI tools","mobile":"Mobile apps","services":"Services"},"checklists":[{"slug":"rezi","name":"Rezi","logo":"/assets/logos/rezi.png","href":"/app/story/rezi/","key":"lv-rezi-checks","items":[{"text":"Make one template, checklist or guide that solves a problem you just solved for yourself, and post it free in the subreddit where people ask about it.","from":""},{"text":"Count how many people download or ask for it in a week. That is your first proof.","from":""},{"text":"Offer a paid version that does the boring part for them, even if it's just a file and a guide.","from":""},{"text":"Build the smallest tool that works (a form that fills in your template) instead of waiting to build the full app.","from":""},{"text":"Pick one new AI feature and test whether it saves your user five minutes.","from":""},{"text":"Write one helpful page that answers a question people search for, and check in a month whether anyone found it.","from":""}],"phases":6,"phase_names":["A template on Reddit","Four slow years","Launch as a paid app","First in line for AI writing","The ChatGPT wave","Search, not ads"]},{"slug":"aeo-engine","name":"AEO Engine","logo":"/assets/logos/aeoengine.png","href":"/app/story/aeo-engine/","key":"lv-aeo-engine-checks","items":[{"text":"Write down one skill you already have (editing, design, a game, a sport) and one new tool or trend it connects to.","from":""},{"text":"Ask ChatGPT a question your favourite local shop's customers would ask, and see whether the shop shows up in the answer.","from":""},{"text":"Make a free one-page 'audit' you could give a business, like a list of 5 fixes for their Instagram or website.","from":""},{"text":"Pick one place your target customers already gather (a Discord, a club, a subreddit) and post one useful tip there.","from":""},{"text":"Put a real price on your offer before anyone asks, even if it's small.","from":""},{"text":"Rank 10 local businesses on one thing you can check (reviews, menu online, opening hours right) and share the list.","from":""}],"phases":5,"phase_names":["An Amazon agency","Spotting the new search","A new name","Showing up everywhere","The jump"]},{"slug":"upscale-b2b","name":"Upscale B2B","logo":"/assets/logos/upscaleb2b.png","href":"/app/story/upscale-b2b/","key":"lv-upscale-b2b-checks","items":[{"text":"List 3 tools or supplies people in a hobby you know (gaming, sneakers, music) keep complaining about.","from":""},{"text":"Find one group that already pays for something (like small video editors or club organisers) and ask what breaks most often.","from":""},{"text":"Price one small product per unit, and write a cheaper price for people who buy 10 or more.","from":""},{"text":"Offer a free 'pilot': one small piece of work for one customer, and agree first what 'it worked' means.","from":""},{"text":"Make a simple calculator in Google Sheets that shows a customer what they'd get if they bought more.","from":""},{"text":"Ask one happy customer for a one-sentence review you can put on your page.","from":""}],"phases":4,"phase_names":["Fixing their own problem","Selling inboxes to agencies","A separate brand for inboxes","Running campaigns, try first"]},{"slug":"dm-champ","name":"DM Champ","logo":"/assets/logos/dmchamp.png","href":"/app/story/dm-champ/","key":"lv-dm-champ-checks","items":[{"text":"Write down one problem you saw a business near you struggle with this month (slow replies, missed calls, no-shows).","from":""},{"text":"Offer to fix it for one business by hand first, before you build anything.","from":""},{"text":"Send ten short, personal emails to local businesses with that offer and follow up with anyone who replies.","from":""},{"text":"Pick a result you can show in money, like old customers who came back, and measure it.","from":""},{"text":"If you sell a cheap version, ask whether the cheapest buyers will actually use it before you set the price.","from":""},{"text":"Find one person with an audience that trusts them and ask if they'd share your thing for a cut of each sale.","from":""}],"phases":6,"phase_names":["The problem at work","Wake up old leads","A cheap launch with lots of refunds","One webinar, and ads that backfired","Stuck around $10K","Sell to agencies instead"]},{"slug":"windmill-growth","name":"Windmill Growth","logo":"/assets/logos/windmillgrowth.png","href":"/app/story/windmill-growth/","key":"lv-windmill-growth-checks","items":[{"text":"Pick one small, cheap version of a service you could do this week, like editing 3 short videos for $20.","from":""},{"text":"Write down the bigger version of that service you could offer to anyone who likes the small one.","from":""},{"text":"Make a simple payment link (Stripe, PayPal or Gumroad) before you have a single customer. You need a parent or guardian to set this up if you're under 18.","from":""},{"text":"Help one person grow their account for free for two weeks, and ask if you can share the before and after.","from":""},{"text":"Build or share one free tool or template that solves a tiny problem for the people you want to sell to.","from":""},{"text":"Write one post that answers a question your buyers type into Google, in your own words, not AI's.","from":""}],"phases":5,"phase_names":["A cheap first offer","Bigger plans for bigger clients","A free tool as bait","Writing for Google too","Steady growth, one main plan"]},{"slug":"stencil-ai","name":"Stencil AI","logo":"/assets/logos/stencilai.png","href":"/app/story/stencil-ai/","key":"lv-stencil-ai-checks","items":[{"text":"Ask three people you know what boring task they repeat every week at work. Write the answers down.","from":""},{"text":"Pick one job with a clear before and after (a photo before, a stencil after) and sketch what a tool would do.","from":""},{"text":"Make a one-page website that shows the result and a price before you build a full app.","from":""},{"text":"Ask one person who does the job for real to test your output and tell you what is wrong with it.","from":""},{"text":"Write one how-to guide that answers a question your customers type into Google.","from":""},{"text":"Put your link in your Instagram or TikTok bio and count the clicks for a week.","from":""}],"phases":5,"phase_names":["A problem in the family","Web first, paid from the start","Selling to professionals","The App Store launch","Holding steady and getting found"]},{"slug":"boothie","name":"Boothie","logo":"/assets/logos/boothie.png","href":"/app/story/boothie/","key":"lv-boothie-checks","items":[{"text":"Scroll TikTok or Instagram for 20 minutes and write down three looks or formats you keep seeing.","from":""},{"text":"Pick one and ask: could a tool make this in one tap? Sketch the before and after.","from":""},{"text":"Make one free thing people can use, and one paid thing that is clearly better.","from":""},{"text":"Post three before-and-after carousels from your own account and track which one gets saved most.","from":""},{"text":"If people find you through TikTok, test that your link actually opens from inside the TikTok app.","from":""},{"text":"Look up what similar apps sell for on TrustMRR to see what a working app can be worth.","from":""}],"phases":5,"phase_names":["A simpler app first?","Launch into a trend","TikTok does the selling","Android and the best month","Selling the business"]},{"slug":"mindset","name":"Mindset","logo":"/assets/logos/mindset.png","href":"/app/story/mindset/","key":"lv-mindset-checks","items":[{"text":"Pick one topic you could post about every week for a year, and post the first one this week.","from":""},{"text":"Look at which of your posts or videos people save or share the most. That's the thing they'd pay for.","from":""},{"text":"Ask five people who follow you what they'd want in an app or tool about that topic.","from":""},{"text":"Give early testers free access and ask them one question: what almost made you stop using it?","from":""},{"text":"If you use other people's content, get permission and agree how they get paid before you launch.","from":""},{"text":"Add one reason to open your app every day (an alarm, a streak, a daily pick) and see if people come back.","from":""}],"phases":5,"phase_names":["YouTube first","Testing quietly","The official launch","Slow, steady growth","Alarms, streaks and subscriptions"]},{"slug":"gojiberry","name":"Gojiberry","logo":"/assets/logos/gojiberry.png","href":"/app/story/gojiberry/","key":"lv-gojiberry-checks","items":[{"text":"Put up a one-page site for your idea with a price on it, not just a waitlist, and see if anyone clicks Buy.","from":""},{"text":"If your waitlist doesn't pay, call five people on it and ask what they would pay for instead.","from":""},{"text":"Write one honest Reddit post about something that went wrong for you, in a subreddit that allows it, and reply to every comment.","from":""},{"text":"Spend a week commenting helpfully in that community before you post about your own project.","from":""},{"text":"Use your own product to find your first customers, so the way you sell is also your demo.","from":""},{"text":"List three channels you haven't tried yet and test one this week for a small amount of time or money.","from":""}],"phases":6,"phase_names":["Done it before","The waitlist that made $0","Rebuild in weeks","Reddit first","Twelve channels at once","Y Combinator and fast growth"]},{"slug":"postiz","name":"Postiz","logo":"/assets/logos/postiz.svg","href":"/app/story/postiz/","key":"lv-postiz-checks","items":[{"id":"c1","text":"Pick one place your users already hang out and post there every time you ship something, even small updates.","from":"Open source"},{"id":"c2","text":"Give something away free and charge for the convenient version, the way Postiz is free to self-host and paid to use hosted.","from":"Move 1"},{"id":"c3","text":"Build a plug-in for a tool that's growing fast right now, like AI agents or n8n. It's cheap for one person and puts you where new users are looking.","from":"The turning point"},{"id":"c4","text":"Find your most active users and build for them. Postiz followed the automation crowd instead of competing with Buffer.","from":"Finding the users who stay"},{"id":"c5","text":"Don't pay for SEO on a brand-new site. Write a few useful posts yourself and spend the money elsewhere.","from":"Building"},{"id":"c6","text":"Plan for a long flat stretch. Postiz stayed under $15K a month for about 14 months after going open source. Pace yourself around school.","from":"Open source"}],"phases":6,"phase_names":["Before Postiz","Building","Open source","Finding the users who stay","The turning point","Scaling the content"]}],"paths":{"rezi":{"title":"Give it away free, charge for the easy version","source":"rezi","name":"Rezi","steps":[{"id":"s1","text":"Make one template, checklist or guide that solves a problem you just solved for yourself, and post it free in the subreddit where people ask about it.","from":"Rezi breakdown","n":1,"task":""},{"id":"s2","text":"Count how many people download or ask for it in a week. That is your first proof.","from":"Rezi breakdown","n":2,"task":""},{"id":"s3","text":"Offer a paid version that does the boring part for them, even if it's just a file and a guide.","from":"Rezi breakdown","n":3,"task":""},{"id":"s4","text":"Build the smallest tool that works (a form that fills in your template) instead of waiting to build the full app.","from":"Rezi breakdown","n":4,"task":""},{"id":"s5","text":"Pick one new AI feature and test whether it saves your user five minutes.","from":"Rezi breakdown","n":5,"task":""}],"lead":{"id":"x1","text":"Make one template, checklist or guide that solves a problem you just solved for yourself, and post it free in the subreddit where people ask about it.","from":"Pattern from Rezi","href":"/app/story/rezi/"}},"aeo-engine":{"title":"Ride a wave","source":"aeo-engine","name":"AEO Engine","steps":[{"id":"s1","text":"Write down one skill you already have (editing, design, a game, a sport) and one new tool or trend it connects to.","from":"AEO Engine breakdown","n":1,"task":""},{"id":"s2","text":"Ask ChatGPT a question your favourite local shop's customers would ask, and see whether the shop shows up in the answer.","from":"AEO Engine breakdown","n":2,"task":""},{"id":"s3","text":"Make a free one-page 'audit' you could give a business, like a list of 5 fixes for their Instagram or website.","from":"AEO Engine breakdown","n":3,"task":""},{"id":"s4","text":"Pick one place your target customers already gather (a Discord, a club, a subreddit) and post one useful tip there.","from":"AEO Engine breakdown","n":4,"task":""},{"id":"s5","text":"Put a real price on your offer before anyone asks, even if it's small.","from":"AEO Engine breakdown","n":5,"task":""}],"lead":{"id":"x1","text":"Write down one skill you already have (editing, design, a game, a sport) and one new tool or trend it connects to.","from":"Pattern from AEO Engine","href":"/app/story/aeo-engine/"}},"upscale-b2b":{"title":"Sell the tools to people already in the game","source":"upscale-b2b","name":"Upscale B2B","steps":[{"id":"s1","text":"List 3 tools or supplies people in a hobby you know (gaming, sneakers, music) keep complaining about.","from":"Upscale B2B breakdown","n":1,"task":""},{"id":"s2","text":"Find one group that already pays for something (like small video editors or club organisers) and ask what breaks most o
